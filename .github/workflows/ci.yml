# Continuous integration: every push and pull request runs the backend tests, the model validation gate,
# the frontend checks and a Docker build of both images. Pushes to the main branches also run the
# full-stack browser test against the Docker Compose stack.
name: CI

on:
  push:
    branches: [main, DURGA-PRASAD-A]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and model validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yieldsense_test
          POSTGRES_USER: yieldsense
          POSTGRES_PASSWORD: ci-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yieldsense -d yieldsense_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://yieldsense:ci-password@127.0.0.1:5432/yieldsense_test
      DATABASE_URL: postgresql+psycopg://yieldsense:ci-password@127.0.0.1:5432/yieldsense_test
      MONGO_URL: mongodb://127.0.0.1:27017
      MONGO_DB: yieldsense_test
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install runtime and test dependencies (no TensorFlow)
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check that the API runtime does not import training-only libraries
        run: |
          python -c "import sys, backend.app.main; bad=[m for m in ('tensorflow','lightgbm','matplotlib','seaborn') if m in sys.modules]; print('training-only modules loaded:', bad); sys.exit(1 if bad else 0)"
      - name: pytest
        run: python -m pytest backend/tests -q
      - name: Model validation gate
        run: python scripts/validate_model.py --json model-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-validation
          path: model-validation.json

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx oxlint src --deny-warnings
      - name: Format
        run: npx prettier --check src
      - name: Unit tests
        run: npx vitest run
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: yieldsense-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: yieldsense-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  e2e:
    name: Full-stack browser test (Docker Compose)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      POSTGRES_PASSWORD: ci-password
      SECRET_KEY: ci-only-secret-key-that-is-long-enough-1234567890
      PUBLIC_URL: http://localhost:8080
      WEB_PORT: "8080"
      # The load test sends every request with one token; the per-user limit would stop it.
      RATE_LIMIT_PER_MINUTE: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health
        run: curl -fsS http://localhost:8080/api/health
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Browser test (headless Chrome)
        working-directory: frontend
        env:
          APP: http://localhost:8080
          API: http://localhost:8080
          BROWSER_PATH: /usr/bin/google-chrome
        run: node e2e/app.e2e.mjs
      - name: Load test (30 s, 10 users)
        run: python3 scripts/load_test.py --base http://localhost:8080 --users 10 --seconds 30 --json load-test.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test
          path: load-test.json
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
